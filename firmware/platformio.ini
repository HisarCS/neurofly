; PlatformIO Project Configuration File for NeuroFly
; Target: Seeed Studio XIAO ESP32-C6 (ESP-IDF / Arduino Framework)

[platformio]
default_envs = drone

[env]
platform = espressif32
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:drone]
build_src_filter = +<drone/*> +<common/*>
lib_deps = 
    Wire

[env:controller]
build_src_filter = +<controller/*> +<common/*>
lib_deps = 
    Wire
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
