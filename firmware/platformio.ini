; PlatformIO Project Configuration File for NeuroFly
; Target: Seeed Studio XIAO ESP32-C6 (ESP-IDF / Arduino Framework)

[platformio]
src_dir = .
default_envs = drone

[env]
platform = espressif32
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:drone]
build_src_filter = -<*> +<drone/> +<common/>
lib_deps = 
    Wire
    pololu/VL53L0X @ ^1.3.1
    pololu/VL53L1X @ ^1.3.1

[env:controller]
build_src_filter = -<*> +<controller/> +<common/>
; INPUT_MODE: 0 = push buttons (default), 1 = analog gimbals via external ADS1115 (I2C 0x48)
build_flags =
    ${env.build_flags}
    -DINPUT_MODE=0
lib_deps = 
    Wire
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ADS1X15 @ ^2.5.0
