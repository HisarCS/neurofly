<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="120mm" viewBox="-60 -60 120 120">
  <g id="laser_cut_red_hairline" stroke="#FF0000" stroke-width="0.1" fill="none">
    <!-- Central Electronics Bay 36x36mm -->
    <rect x="-18" y="-18" width="36" height="36" rx="3" ry="3" />
    
    <!-- Weight Reduction Central Cutout 14x14mm -->
    <rect x="-7" y="-7" width="14" height="14" rx="2" ry="2" />
    
    <!-- Standard 30.5mm x 30.5mm Flight Controller M2 Mounting Holes -->
    <circle cx="-15.25" cy="-15.25" r="1.1" />
    <circle cx="15.25" cy="-15.25" r="1.1" />
    <circle cx="15.25" cy="15.25" r="1.1" />
    <circle cx="-15.25" cy="15.25" r="1.1" />
    
    <!-- Battery Strap Slots (2mm x 12mm) -->
    <rect x="-6" y="-14" width="12" height="2" rx="1" ry="1" />
    <rect x="-6" y="12" width="12" height="2" rx="1" ry="1" />

    <!-- 4 Diagonal Motor Arms (Wheelbase = 85mm motor-to-motor) -->
    <!-- Front-Left Motor Mount (at -30, -30) -->
    <circle cx="-30" cy="-30" r="5.5" />
    <circle cx="-30" cy="-30" r="4.25" />
    
    <!-- Front-Right Motor Mount (at 30, -30) -->
    <circle cx="30" cy="-30" r="5.5" />
    <circle cx="30" cy="-30" r="4.25" />
    
    <!-- Rear-Right Motor Mount (at 30, 30) -->
    <circle cx="30" cy="30" r="5.5" />
    <circle cx="30" cy="30" r="4.25" />
    
    <!-- Rear-Left Motor Mount (at -30, 30) -->
    <circle cx="-30" cy="30" r="5.5" />
    <circle cx="-30" cy="30" r="4.25" />

    <!-- Arm Traces / Structural Struts -->
    <line x1="-12" y1="-15" x2="-26" y2="-29" />
    <line x1="-15" y1="-12" x2="-29" y2="-26" />

    <line x1="12" y1="-15" x2="26" y2="-29" />
    <line x1="15" y1="-12" x2="29" y2="-26" />

    <line x1="12" y1="15" x2="26" y2="29" />
    <line x1="15" y1="12" x2="29" y2="26" />

    <line x1="-12" y1="15" x2="-26" y2="29" />
    <line x1="-15" y1="12" x2="-29" y2="26" />
  </g>
</svg>